plugins { id 'com.android.application' }
android {
    namespace 'org.mininotes.android'
    compileSdk 37
    // Editor instrumentation runs only in the synthetic demo, alongside the owner's app when used on a test device.
    testBuildType 'demo'
    defaultConfig {
        applicationId 'org.mininotes.android'
        minSdk 28
        targetSdk 35
        versionCode 4027
        versionName '0.4.027'
        testInstrumentationRunner 'org.mininotes.android.PadPerformanceProbe'
        // True only in the demo build below: made-up notes on first start and pretend recovery words (see Demo).
        buildConfigField 'boolean','DEMO','false'
    }
    buildFeatures { buildConfig true }
    // The translation engine (docs/TRANSLATION.md), built by tools/build-translation-engine-android.ps1 into native/jniLibs, which
    // is never in the tree. Carried as a library and unpacked on install, as Android runs a program only from there.
    sourceSets { main { jniLibs.srcDirs += [rootProject.file('../native/jniLibs')] } }
    packaging { jniLibs { useLegacyPackaging true } }
    // Unpacked, but kept uncompressed in the APK, so Android's 16 KB check can read every library (it said "Unknown error"
    // for SQLCipher's, compressed by the line above, the owner's Graphene, 2026-10-13).
    androidResources { noCompress += ['so'] }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

    // The Maxima transport's IPC is signature-gated: it answers an app signed with its own key and nobody
    // else. So a build that is to ask it anything has to be signed with that key. Where to find the key and
    // what it is called are read from an untracked file, never from here - a key checked into a repository
    // is a key that has been given away.
    //
    // Put this in android/keystore.properties, which .gitignore already keeps out:
    //     storeFile=/path/to/family-release.jks
    //     storePassword=...
    //     keyAlias=...
    //     keyPassword=...
    // Then: ./gradlew assembleRelease  -> a signed APK the transport will talk to.
    // Without that file the release build is unsigned exactly as it was, and nothing here fails.
    signingConfigs {
        family {
            def where=rootProject.file('keystore.properties')
            if(where.exists()) {
                def said=new Properties()
                where.withInputStream { said.load(it) }
                storeFile file(said.getProperty('storeFile'))
                storePassword said.getProperty('storePassword')
                keyAlias said.getProperty('keyAlias')
                keyPassword said.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if(rootProject.file('keystore.properties').exists())signingConfig signingConfigs.family
        }
        // A demo for recording the website's animation: the same sources, installed beside the real app with its own
        // notebook, filled with made-up notes on first start and showing pretend recovery words. Never released.
        //     gradlew -p android assembleDemo  ->  app/build/outputs/apk/demo/app-demo.apk
        demo {
            initWith debug
            applicationIdSuffix '.demo'
            versionNameSuffix '-demo'
            debuggable true
            signingConfig signingConfigs.debug
            matchingFallbacks=['debug']
            buildConfigField 'boolean','DEMO','true'
        }
    }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.zxing:core:3.5.3'
    // Reading and drawing QR codes. Plain Java, Apache-2.0, no AndroidX: a pairing line is 350 characters,
    // which is a thing to point a camera at rather than a thing to type.
    implementation 'com.google.zxing:core:3.5.3'
    // The Maxima transport itself, vendored under maxima-core/. This app does not ask another app for an
    // address any more: it is the node, the way Parlons is, so the address is simply something it knows.
    implementation project(':maxima-core')
    // SQLCipher: the notebook encrypted with its key when the owner sets a password (Profile → Security).
    implementation 'net.zetetic:sqlcipher-android:4.19.0@aar'
    implementation 'androidx.sqlite:sqlite:2.7.1'
}
